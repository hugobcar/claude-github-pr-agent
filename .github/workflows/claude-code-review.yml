name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow gh CLI commands for posting PR comments and reviews
          claude_args: '--allowedTools "Bash(gh *)"'
          prompt: |
            Review the code changes in this pull request against the coding standards in CLAUDE.md.

            First, get the PR diff:
            gh pr diff ${{ github.event.pull_request.number }}

            Then analyze the changes for:
            - Code style and best practices
            - Type hints and documentation
            - Security issues
            - Error handling
            - Any violations of the guidelines in CLAUDE.md

            After your analysis, post your review as a PR comment using:
            gh pr review ${{ github.event.pull_request.number }} --comment --body "YOUR_REVIEW_HERE"

            If there are specific issues, you can also add inline comments on specific files/lines.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

